<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0c0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Finger Drum Trainer</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
</head>
<body>

  <!-- ===================== LIBRARY ===================== -->
  <section id="screen-library" class="screen active">
    <header class="app-header">
      <div class="brand">🥁 Finger Drum Trainer</div>
      <button id="upload-btn" class="btn btn-primary">+ Upload MP3</button>
    </header>

    <div id="drop-zone" class="drop-zone">
      <div class="drop-inner">
        <div class="drop-icon">⬆</div>
        <div>Drop an MP3 here, or <button id="empty-upload" class="link-btn">browse</button></div>
        <p class="muted">Your song is analyzed on-device. The drum part is transcribed into practice notes and saved to your phone for offline practice.</p>
      </div>
    </div>

    <h2 class="section-title">Your Library</h2>
    <div id="library-list" class="library-list"></div>
    <div id="storage-info" class="muted storage-info"></div>

    <input type="file" id="file-input" accept="audio/*,.mp3" hidden />
  </section>

  <!-- ===================== CONVERT ===================== -->
  <section id="screen-convert" class="screen">
    <header class="app-header">
      <button id="convert-back" class="btn btn-ghost hidden">← Back</button>
      <div class="brand">Analyzing drums…</div>
      <span></span>
    </header>
    <div class="convert-wrap">
      <div id="convert-filename" class="convert-filename"></div>
      <div id="convert-progress" class="convert-progress hidden">
        <div class="bar-track"><div id="convert-bar" class="bar-fill"></div></div>
        <div id="convert-msg" class="muted"></div>
      </div>
    </div>
  </section>

  <!-- ===================== PLAY ===================== -->
  <section id="screen-play" class="screen play-screen">
    <!-- Left control rail -->
    <aside class="rail">
      <div class="rail-top">
        <button id="back-to-library" class="icon-btn" title="Library">☰</button>
        <button id="open-settings" class="icon-btn" title="Settings">⚙</button>
      </div>

      <div class="mixer">
        <label>Backing</label>
        <input type="range" id="vol-backing" min="0" max="100" value="85" class="vmix" />
        <label>Your Notes</label>
        <input type="range" id="vol-user" min="0" max="100" value="90" class="vmix" />
        <label>Guide</label>
        <input type="range" id="vol-guide" min="0" max="100" value="0" class="vmix" />
      </div>

      <label class="switch-row">
        <input type="checkbox" id="metro-toggle" />
        <span>Metronome</span>
      </label>

      <div class="transport">
        <button id="restart" class="round-btn restart" title="Restart">↺</button>
        <button id="play-pause" class="round-btn play" title="Play/Pause">▶</button>
      </div>
    </aside>

    <!-- Main highway -->
    <main class="stage">
      <div class="stage-header">
        <div id="song-title" class="song-title"></div>
        <div class="stats">
          <div class="stat"><span class="stat-num" id="stat-streak">0</span><span class="stat-lbl">streak</span></div>
          <div class="stat"><span class="stat-num" id="stat-acc">100%</span><span class="stat-lbl">accuracy</span></div>
          <div class="stat"><span class="stat-num" id="stat-hits">0</span><span class="stat-lbl">hits</span></div>
        </div>
      </div>

      <div class="highway">
        <div id="lane-labels" class="lane-labels"></div>
        <canvas id="roll-canvas" class="roll-canvas"></canvas>
      </div>

      <!-- Mobile-only drawer toggle for the controls below the highway -->
      <button id="mobile-controls-toggle" class="mobile-controls-toggle" type="button">
        <span id="mobile-controls-toggle-label">⚙ Controls</span>
      </button>

      <!-- Seek + speed -->
      <div class="under-stage">
        <div class="seek-row">
          <span id="time-current" class="time">0:00</span>
          <input type="range" id="seek-range" min="0" max="1000" value="0" class="seek" />
          <span id="time-total" class="time">0:00</span>
        </div>
        <div class="speed-row">
          <span class="speed-lbl">Speed</span>
          <input type="range" id="speed-range" min="25" max="150" value="100" class="speed" />
          <span id="speed-value" class="speed-val">100%</span>
          <div class="speed-presets">
            <button class="speed-preset" data-rate="0.5">50%</button>
            <button class="speed-preset" data-rate="0.75">75%</button>
            <button class="speed-preset" data-rate="1">100%</button>
          </div>
        </div>
      </div>

      <!-- Track on/off -->
      <div class="tracks-row">
        <span class="tracks-lbl">Practice tracks:</span>
        <div id="track-toggles" class="track-toggles"></div>
      </div>

      <!-- Pads -->
      <div id="pad-grid" class="pad-grid"></div>
    </main>
  </section>

  <!-- ===================== SETTINGS ===================== -->
  <section id="screen-settings" class="screen">
    <header class="app-header">
      <button id="settings-back" class="btn btn-ghost">← Back</button>
      <div class="brand">Pad Settings</div>
      <span></span>
    </header>
    <div id="settings-body" class="settings-body"></div>
  </section>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
